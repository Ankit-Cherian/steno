name: Feature Request
description: Suggest a feature for Steno
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "This issue is public. Use synthetic examples and keep private transcripts, audio, editor content, credentials, and personal file paths out of text and attachments."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've thought about
