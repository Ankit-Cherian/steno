name: Bug Report
description: Report a bug in Steno
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue and its attachments are public. Use synthetic examples and remove private transcripts, audio, editor content, credentials, and personal file paths from logs or screenshots. Do not upload your history or settings files.

        Do not attach recordings, or transcripts with personal content.

        Report vulnerabilities through [the security policy](https://github.com/Ankit-Cherian/steno/blob/main/SECURITY.md), not this form.
  - type: input
    id: app-version
    attributes:
      label: Steno Version and Build
      description: Shown in Settings › General. If you built from source, include the commit and note any local changes.
      placeholder: "e.g., Steno 1.1.0 (5), or built from source at a commit"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      placeholder: "e.g., macOS 15.6"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? For transcription issues, say whether it affected the live transcript, the final text, insertion, or History.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue using non-sensitive sample text?
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions Granted
      description: Check each permission that is on in System Settings › Privacy & Security.
      options:
        - label: Microphone
        - label: Accessibility
        - label: Input Monitoring
  - type: dropdown
    id: recording-start
    attributes:
      label: How the Recording Started
      description: For recording or transcription issues.
      options:
        - Hold Option
        - The hands-free key
        - The Dictate area in the main window
        - Dictate in the menu bar
        - Not about a recording
  - type: input
    id: transcription-setup
    attributes:
      label: Transcription Setup
      description: For transcription issues, include the speech model from Settings › Speech Model, whether Show live transcript was on, and the approximate recording duration. Do not include model file paths.
  - type: textarea
    id: logs
    attributes:
      label: Additional Context
      description: Optional sanitized logs, screenshots, or other context. Review all visible content and attachments for private data before submitting.
