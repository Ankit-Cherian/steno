name: Recover 1.0 release signing

on:
  workflow_dispatch:
    inputs:
      recovery_authorized:
        description: 'Approve the documented 1.0 signing recovery and release with the disclosed manual acceptance limits'
        required: true
        default: false
        type: boolean
      publish_release:
        description: 'After protected draft review, request approval to publish 1.0.0 as latest'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: steno-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: '1.0.0'
  RELEASE_SHA: d25fcdf9d625eea6ee31bd0b03c5994302e8065e
  RECOVERY_AUTHORIZED: ${{ inputs.recovery_authorized }}
  STENO_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/Steno
  STENO_REUSED_VALIDATION_RUN_ID: '35041760947'
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: bash

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d25fcdf9d625eea6ee31bd0b03c5994302e8065e
          path: Steno
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source, completed checks, and absence of a prior submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/scripts/ci/release-recovery.py preflight

  sign:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GGML_METAL_DEVICES: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d25fcdf9d625eea6ee31bd0b03c5994302e8065e
          path: Steno
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck recovery evidence after protected approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          test "$RELEASE_ENABLED" = true
          test "$(uname -m)" = arm64
          python3 control/scripts/ci/release-recovery.py preflight
      - name: Prepare unchanged pinned tools and runtime inputs
        run: |
          bash control/scripts/ci/tools.sh xcodegen
          echo "$GITHUB_WORKSPACE/control/build/ci-tools/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          bash control/scripts/ci/prepare-runtime.sh --root "$RUNNER_TEMP/steno-release-runtime"
      - name: Sign unchanged source, notarize once, staple, and verify
        run: bash control/scripts/ci/release-sign.sh
        env:
          STENO_REUSED_VALIDATION_RECEIPT_JSON: ${{ runner.temp }}/steno-reused-validation.json
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      - name: Preserve sanitized notarization recovery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notary-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/steno-release-distribution/release-notary-receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Attest the final DMG and its source-binding manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/steno-release-assets/Steno-1.0.0.dmg
            ${{ runner.temp }}/steno-release-assets/release-manifest.json
      - name: Verify both attestations and source identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/scripts/ci/release-recovery.py verify-assets
      - name: Preserve only the verified public release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovered-release-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/steno-release-assets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-draft
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d25fcdf9d625eea6ee31bd0b03c5994302e8065e
          path: Steno
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovered-release-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/steno-release-assets
      - name: Verify provenance and create one draft with reviewed notes
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT_ENABLED: ${{ vars.RELEASE_DRAFT_ENABLED }}
        run: |
          test "$RELEASE_DRAFT_ENABLED" = true
          python3 control/scripts/ci/release-recovery.py draft

  publish:
    if: inputs.publish_release
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d25fcdf9d625eea6ee31bd0b03c5994302e8065e
          path: Steno
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovered-release-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/steno-release-assets
      - name: Reverify both identities and publish the exact reviewed draft once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
        run: |
          test "$RELEASE_PUBLISH_ENABLED" = true
          python3 control/scripts/ci/release-recovery.py publish
