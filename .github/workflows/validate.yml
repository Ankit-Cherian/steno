name: Validate

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  policy:
    name: Workflow and release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.changes.outputs.scope }}
      runtime_required: ${{ steps.changes.outputs.runtime_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        run: python3 scripts/ci/select-checks.py
      - name: Validate automation policy and regression tests
        run: |
          test -z "$(git ls-files 'Steno.xcodeproj/*')" || { echo 'Xcode project must remain generated and untracked.' >&2; exit 1; }
          python3 scripts/ci/check-doc-links.py
          python3 scripts/ci/check-policy.py
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
          for script in scripts/ci/*.sh scripts/release-dmg.sh scripts/check.sh; do bash -n "$script"; done
          bash scripts/ci/tools.sh actionlint
          build/ci-tools/actionlint/actionlint -shellcheck= -pyflakes=
          git diff --check

      - name: Prepare artifact compatibility fixture
        run: |
          mkdir -p build/artifact-roundtrip/source
          printf 'Steno artifact compatibility fixture\n' > build/artifact-roundtrip/source/payload.txt
          (cd build/artifact-roundtrip/source && sha256sum payload.txt > SHA256SUMS)
      - name: Upload artifact compatibility fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifact-roundtrip/source/
          if-no-files-found: error
          retention-days: 1
      - name: Download artifact compatibility fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifact-roundtrip/download
      - name: Verify downloaded artifact layout and contents
        run: |
          cd build/artifact-roundtrip/download
          sha256sum --check SHA256SUMS
          test "$(find . -type f | wc -l)" -eq 2

  macos:
    needs: policy
    if: needs.policy.outputs.scope == 'full'
    name: Package and hosted tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TEST_RUNNER_STENO_UI_RENDER_OUTPUT: ${{ github.workspace }}/build/ci/renders/app
      TEST_RUNNER_STENO_OVERLAY_ACCENT_RENDER_OUTPUT: ${{ github.workspace }}/build/ci/renders/accents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain and generate project
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          bash scripts/ci/tools.sh xcodegen
          build/ci-tools/xcodegen/xcodegen/bin/xcodegen generate
      - name: Package tests with coverage
        run: |
          mkdir -p build/ci
          swift test --package-path StenoKit --enable-code-coverage 2>&1 | tee build/ci/package-tests.log
          swift test --package-path StenoKit --show-codecov-path > build/ci/coverage-path.txt
          cp "$(cat build/ci/coverage-path.txt)" build/ci/package-coverage.json
      - name: Native prompt verification policy
        run: bash scripts/test-whisper-prompt-verification.sh
      - name: Build macOS app
        run: |
          xcodebuild build -project Steno.xcodeproj -scheme Steno \
            -destination 'platform=macOS' -derivedDataPath build/ci/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/app-build.log
      - name: Hosted tests and production-view renders
        run: |
          xcodebuild test -project Steno.xcodeproj -scheme Steno \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/ci/DerivedData \
            -resultBundlePath build/ci/HostedTests.xcresult \
            -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci/hosted-tests.log
          test -s build/ci/renders/app/render-matrix.csv
          test -s build/ci/renders/accents/overlay-accent-render-receipt.csv
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-${{ github.sha }}
          retention-days: 14
          path: |
            build/ci/*.log
            build/ci/package-coverage.json
            build/ci/HostedTests.xcresult
            build/ci/renders/

  runtime:
    needs: policy
    if: needs.policy.outputs.runtime_required == 'true'
    name: Runtime and distribution preview
    runs-on: macos-15
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GGML_METAL_DEVICES: '0'
      STENO_TEST_WHISPER_THREADS: '3'
      # The package's default build directory, which the preview's bundled-runtime
      # test also uses, so the job compiles the Swift package once.
      STENO_SWIFT_SCRATCH_PATH: ${{ github.workspace }}/StenoKit/.build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned build tools and runtime assets
        run: |
          test "$(uname -m)" = arm64
          bash scripts/ci/tools.sh xcodegen
          echo "$GITHUB_WORKSPACE/build/ci-tools/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          bash scripts/ci/prepare-runtime.sh
      # The preview is built before the slow suites so it is available sooner.
      # The gate still requires every step, including the slow suites, to pass.
      - name: Native runtime build and contracts
        run: bash scripts/ci/runtime-checks.sh --stage fast --backend cpu --root "$GITHUB_WORKSPACE/vendor/whisper.cpp" --output "$GITHUB_WORKSPACE/build/ci/runtime"
      - name: Public audio benchmark and zero cleanup regression
        env:
          STENO_WHISPER_BUILD_DIR: ${{ github.workspace }}/build/ci/runtime/build-steno
        run: bash scripts/ci/benchmark.sh
      - name: Build self-contained preview DMG without release credentials
        env:
          STENO_BUNDLED_WHISPER_ROOT: ${{ github.workspace }}/vendor/whisper.cpp
          STENO_BUNDLED_WHISPER_BUILD_DIR: ${{ github.workspace }}/build/ci/runtime/build-steno
          STENO_BUNDLED_MODEL_PATH: ${{ github.workspace }}/vendor/whisper.cpp/models/ggml-small.en.bin
          STENO_BUNDLED_VAD_MODEL_PATH: ${{ github.workspace }}/vendor/whisper.cpp/models/ggml-silero-v6.2.0.bin
          STENO_DIST_DIR: ${{ github.workspace }}/build/ci/distribution
        run: bash scripts/release-dmg.sh --unsigned-preview
      - name: Upload preview for manual testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-preview-arm64-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: build/ci/distribution/*-preview.dmg
      - name: Native protocol matrix and prompt scoring
        run: bash scripts/ci/runtime-checks.sh --stage slow --backend cpu --root "$GITHUB_WORKSPACE/vendor/whisper.cpp" --output "$GITHUB_WORKSPACE/build/ci/runtime"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-evidence-${{ github.sha }}
          retention-days: 14
          path: |
            build/ci/runtime/*.json
            build/ci/runtime/*.log
            build/ci/runtime/*.txt
            build/ci/benchmark/*.json
            build/ci/benchmark/*.md

  gate:
    name: CI Gate
    if: always()
    needs: [policy, macos, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          SCOPE: ${{ needs.policy.outputs.scope }}
          RUNTIME_REQUIRED: ${{ needs.policy.outputs.runtime_required }}
          EVENT_NAME: ${{ github.event_name }}
          POLICY_RESULT: ${{ needs.policy.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$POLICY_RESULT" = success
          case "$SCOPE" in docs|full) ;; *) exit 1 ;; esac
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
          # Only a pull request may skip a job; main, schedules, dispatches,
          # merge groups and release calls must have run everything.
          if [ "$EVENT_NAME" != pull_request ]; then
            test "$SCOPE" = full
            test "$RUNTIME_REQUIRED" = true
          fi
          if [ "$SCOPE" = docs ]; then
            test "$RUNTIME_REQUIRED" = false
            macos_expected=skipped
          else
            macos_expected=success
          fi
          if [ "$RUNTIME_REQUIRED" = true ]; then runtime_expected=success; else runtime_expected=skipped; fi
          test "$MACOS_RESULT" = "$macos_expected"
          test "$RUNTIME_RESULT" = "$runtime_expected"
