name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # Weekly full validation of main catches runner-image drift that no change
  # reveals. It starts an hour after the weekly Security scan.
  schedule:
    - cron: '31 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels only an obsolete pull request run. Every other run has
# its own group, so main is never cancelled or replaced while pending.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
