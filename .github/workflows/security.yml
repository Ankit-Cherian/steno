name: Security

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # The severity gate needs full results on PRs as well as main.
  CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify security scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.changes.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        run: python3 scripts/ci/select-checks.py

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review newly introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          warn-only: false
          comment-summary-in-pr: never

  actions:
    name: CodeQL (Actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:actions
          output: build/codeql-results
      - name: Block high and critical findings
        run: python3 scripts/ci/check-sarif.py --directory build/codeql-results --category /language:actions

  native:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    name: CodeQL (${{ matrix.language }})
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [swift, c-cpp]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Prepare pinned native sources
        if: matrix.language == 'c-cpp'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/whisper.cpp
          ref: 764482c3175d9c3bc6089c1ec84df7d1b9537d83
          path: vendor/whisper.cpp
          persist-credentials: false
      - name: Prepare project generator
        if: matrix.language == 'swift'
        run: |
          bash scripts/ci/tools.sh xcodegen
          build/ci-tools/xcodegen/xcodegen/bin/xcodegen generate
      # Package resolution compiles no project source. Doing it before init keeps
      # it out of the traced build, which reuses the same derived data.
      - name: Resolve Swift packages before tracing
        if: matrix.language == 'swift'
        run: |
          xcodebuild -resolvePackageDependencies -project Steno.xcodeproj -scheme Steno \
            -derivedDataPath build/codeql-swift
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: security-extended
      # A fresh build after init lets CodeQL observe actual compiler invocations.
      # No compilation cache is restored in this workflow.
      - name: Build Swift app for analysis
        if: matrix.language == 'swift'
        run: |
          xcodebuild build -project Steno.xcodeproj -scheme Steno \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/codeql-swift \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      - name: Build C++ runtime for analysis
        if: matrix.language == 'c-cpp'
        run: bash scripts/build-whisper-runtime-helper.sh
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:${{ matrix.language }}
          output: build/codeql-results
      - name: Block high and critical findings
        env:
          ANALYSIS_CATEGORY: /language:${{ matrix.language }}
        run: |
          args=(--directory build/codeql-results --category "$ANALYSIS_CATEGORY")
          if [ "$ANALYSIS_CATEGORY" = /language:c-cpp ]; then
            args+=(--reviewed-dispositions scripts/ci/reviewed-findings.json --source-root .)
          fi
          python3 scripts/ci/check-sarif.py "${args[@]}"

  gate:
    name: Security Gate
    if: always()
    needs: [changes, dependency-review, actions, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable security checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          ACTIONS_RESULT: ${{ needs.actions.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$ACTIONS_RESULT" = success
          test "$SCOPE_RESULT" = success
          case "$SCOPE" in
            docs) expected=skipped ;;
            full) expected=success ;;
            *) exit 1 ;;
          esac
          test "$NATIVE_RESULT" = "$expected"
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_RESULT" = success
          else
            test "$DEPENDENCY_RESULT" = skipped
          fi
