name: Steno
options:
  # Without this, XcodeGen picks the first configuration by name, Acceptance,
  # as the default for builds that name no configuration.
  defaultConfig: Release
  deploymentTarget:
    macOS: "13.0"
configs:
  Debug: debug
  Release: release
  # Release optimisation with its own bundle identifier, name and storage
  # folder, for live acceptance runs. See Steno/Acceptance.
  Acceptance: release
packages:
  StenoKit:
    path: ./StenoKit
targets:
  Steno:
    type: application
    platform: macOS
    sources:
      - path: Steno
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.stenoapp.steno
        # Contributor-first signing defaults:
        # - no fixed team ID in tracked source
        # - each contributor chooses their own team in local Xcode settings
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: Steno/Steno.entitlements
        SWIFT_VERSION: 6.0
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 5
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Steno needs microphone access for dictation.
        # The acceptance sources compile only in the Acceptance configuration.
        EXCLUDED_SOURCE_FILE_NAMES: "Acceptance*.swift"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
        Acceptance:
          PRODUCT_BUNDLE_IDENTIFIER: io.stenoapp.steno.acceptance
          PRODUCT_NAME: Steno Acceptance
          PRODUCT_MODULE_NAME: Steno
          INFOPLIST_KEY_CFBundleDisplayName: Steno Acceptance
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STENO_ACCEPTANCE"
          EXCLUDED_SOURCE_FILE_NAMES: ""
    dependencies:
      - package: StenoKit
        product: StenoKit
    scheme:
      testTargets:
        - StenoTests
  StenoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StenoTests
      # The acceptance sources compile here with their flag so their tests can
      # run without launching the acceptance app.
      - path: Steno/Acceptance
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STENO_ACCEPTANCE"
        PRODUCT_BUNDLE_IDENTIFIER: io.stenoapp.steno.tests
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Steno.app/Contents/MacOS/Steno"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Steno
      - package: StenoKit
        product: StenoKit
      - package: StenoKit
        product: StenoBenchmarkCore
